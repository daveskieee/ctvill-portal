<!doctype html>
<html lang="en" class="dark" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020617" />
    <title>LDM Construction | Engineers • Architects • Builders</title>
    <meta name="description" content="LDM Construction — Engineers • Architects • Builders. Full-service Architectural Design, Custom Interior Fit-Out, and Turnkey Residential & Commercial Construction. Giving Life to Your Dreams." />
    <link rel="icon" type="image/png" href="/ldm-logo.png?v=2" />
    <link rel="apple-touch-icon" href="/ldm-logo.png?v=2" />
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
      }
      html.light, html.light body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      #root {
        min-height: 100%;
        background-color: inherit;
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ctvill_theme');
          var isLight = theme === 'light';
          var root = document.documentElement;
          if (isLight) {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.backgroundColor = '#f8fafc';
            root.style.colorScheme = 'light';
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.backgroundColor = '#020617';
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.style.backgroundColor = '#020617';
        }
      })();
    </script>
  </head>
  <body style="background-color: #020617;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
